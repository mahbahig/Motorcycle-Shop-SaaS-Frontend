<div class="mb-6 flex flex-col">
  <label
    [for]="idInput()"
    class="mb-2 block font-tajawal text-sm font-medium text-navy-700 dark:text-gray-300"
  >
    {{ label() }}
  </label>

  <div class="relative w-full">
    @if (element() === 'input') {
      <input
        enterNext
        [id]="idInput()"
        [formField]="field()"
        [type]="isPassword() ? (showPassword() ? 'text' : 'password') : typeInput()"
        [placeholder]="placeholderInput()"
        class="w-full rounded-xl border border-navy-200 bg-navy-50 px-12 py-3.5 font-tajawal text-base text-navy-900 transition-all duration-200 placeholder-navy-300 focus:border-navy-700 focus:bg-white focus:ring-2 focus:ring-navy-100 dark:border-gray-700 dark:bg-gray-900 dark:text-white dark:placeholder-gray-600 dark:focus:border-navy-400 dark:focus:bg-gray-800 dark:focus:ring-navy-900"
      />
    } @else {
      <textarea
        enterNext
        [id]="idInput()"
        [formField]="field()"
        [placeholder]="placeholderInput()"
        class="w-full rounded-xl border border-navy-200 bg-navy-50 px-12 py-3.5 font-tajawal text-base text-navy-900 transition-all duration-200 placeholder-navy-300 focus:border-navy-700 focus:bg-white focus:ring-2 focus:ring-navy-100 dark:border-gray-700 dark:bg-gray-900 dark:text-white dark:placeholder-gray-600 dark:focus:border-navy-400 dark:focus:bg-gray-800 dark:focus:ring-navy-900"
      ></textarea>
    }

    @if (isPassword()) {
      <button
        type="button"
        class="absolute inset-y-0 inset-e-4 flex items-center"
        (click)="showPassword.update(v => !v)"
      >
        @if (showPassword()) {
          <i class="fas fa-eye-slash text-navy-400 dark:text-gray-500"></i>
        } @else {
          <i class="fas fa-eye text-navy-400 dark:text-gray-500"></i>
        }
      </button>
    }
  </div>
</div>
